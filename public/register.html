<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Hidden Harmonies</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-left">

            <div class="logo">
                Hidden <span>Harmonies</span>
            </div>

            <div class="left-content">

                <p class="small-heading">
                    FIND YOUR NEXT FAVOURITE VOICE
                </p>

                <h1>
                    Discover music
                    <span>you haven't heard.</span>
                </h1>

                <p>
                    Create your account and keep track of
                    the artists and songs you discover.
                </p>

            </div>

        </div>


        <div class="login-right">

            <div class="login-box">

                <p class="small-heading">
                    JOIN HIDDEN HARMONIES
                </p>

                <h2>
                    Create Account
                </h2>

                <p class="login-text">
                    Create an account to start discovering.
                </p>

                <form id="registerForm">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >


                    <button type="submit">
                        Create Account →
                    </button>

                    <p id="message"></p>

                </form>


                <p class="signup-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
