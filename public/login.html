<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Hidden Harmonies</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-left">
            <div class="logo">
                Hidden <span>Harmonies</span>
            </div>

            <div class="left-content">
                <p class="small-heading">THE STORIES BEHIND THE MUSIC</p>

                <h1>
                    Some voices deserve
                    <span>to be heard.</span>
                </h1>

                <p>
                    Discover artists, music and stories that
                    deserve to be brought into the spotlight.
                </p>
            </div>
        </div>


        <div class="login-right">

            <div class="login-box">

                <p class="small-heading">WELCOME BACK</p>

                <h2>Login</h2>

                <p class="login-text">
                    Sign in to explore Hidden Harmonies.
                </p>

                <form id="loginForm">

                    <label for="username">Username</label>
<input
    type="text"
    id="username"
    placeholder="Enter your username"
    required
>

<label for="email">Email</label>
<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label for="password">Password</label>
<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

                    <button type="submit">
                        Login →
                    </button>

                    <p id="message"></p>

                </form>

                <p class="signup-text">
                    No account?
                   <a href="register.html">Create one</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
